<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SB-Studio</title>
<script>
/* Muss vor dem Stylesheet laufen, sonst blitzt die Seite erst hell auf.
   „Automatisch“ wird hier zu light oder dark aufgelöst – das Stylesheet
   kennt nur diese beiden Werte (wie SB-Project). */
(() => {
  const KEY = 'sbs-theme-v1', MODES = ['system', 'light', 'dark'];
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  let pref = 'system';
  try { pref = localStorage.getItem(KEY) || 'system'; } catch (e) { /* nur Komfort */ }
  if (!MODES.includes(pref)) pref = 'system';
  const apply = () => {
    document.documentElement.dataset.theme = pref === 'system' ? (media.matches ? 'dark' : 'light') : pref;
    window.dispatchEvent(new Event('sbs-theme'));
  };
  apply();
  media.addEventListener('change', () => { if (pref === 'system') apply(); });
  window.SBSTheme = {
    mode: () => pref,
    resolved: () => document.documentElement.dataset.theme,
    set(next) {
      pref = MODES.includes(next) ? next : 'system';
      try { localStorage.setItem(KEY, pref); } catch (e) { /* nur Komfort */ }
      apply();
      return pref;
    },
    next: () => ({ system: 'light', light: 'dark', dark: 'system' })[pref]
  };
})();
</script>
<link rel="stylesheet" href="styles.css">
<script src="js/i18n.js"></script>
<script src="js/lang-en.js"></script>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <img class="logo" src="selfbus-logo.png" alt="Selfbus" width="76" height="32">
    <div class="brand-text">
      <b>SB-Studio</b>
      <span data-i18n>Geräte-Editor für die sblib</span>
    </div>
  </div>

  <button id="btn-palette" class="btn btn-icon only-narrow" title="Blöcke" data-i18n-title aria-label="Blöcke" data-i18n-aria-label>
    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><path d="M11.5 9v5M9 11.5h5"/></svg>
  </button>

  <div class="group device-group">
    <input id="device-name" aria-label="Gerätename" data-i18n-aria-label spellcheck="false">
    <button id="btn-device" class="btn btn-icon" title="Geräteeinstellungen" data-i18n-title aria-label="Geräteeinstellungen" data-i18n-aria-label>
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M6.9 1.8h2.2l.4 1.8 1.1.6 1.7-.6 1.1 1.9-1.3 1.2v1.3l1.3 1.2-1.1 1.9-1.7-.6-1.1.6-.4 1.8H6.9l-.4-1.8-1.1-.6-1.7.6-1.1-1.9 1.3-1.2V6.7L2.6 5.5l1.1-1.9 1.7.6 1.1-.6z"/><circle cx="8" cy="8" r="2"/></svg>
    </button>
  </div>

  <div class="histbar" role="group" aria-label="Verlauf" data-i18n-aria-label>
    <button id="btn-undo" class="hist-btn" disabled>
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 7h7a3.5 3.5 0 0 1 0 7H7"/><path d="M6 4 3 7l3 3"/></svg>
    </button>
    <button id="btn-redo" class="hist-btn" disabled>
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 7H6a3.5 3.5 0 0 0 0 7h3"/><path d="M10 4l3 3-3 3"/></svg>
    </button>
  </div>

  <!-- Datei: Modell des Geräts (.sbs.json) -->
  <div class="group wide-only" role="group" aria-label="Datei" data-i18n-aria-label>
    <button id="btn-new" class="btn btn-icon" title="Neues Gerät" data-i18n-title aria-label="Neues Gerät" data-i18n-aria-label>
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 1.8h5l3 3v9.4H4z"/><path d="M9 1.8v3h3M8 7.5v4M6 9.5h4"/></svg>
    </button>
    <button id="btn-open" class="btn btn-icon" title="Öffnen (.sbs.json)" data-i18n-title aria-label="Öffnen" data-i18n-aria-label>
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M1.8 13.2V3.3h4l1.3 1.5h5.6v2"/><path d="M1.8 13.2l2-5.4h10.4l-2 5.4z"/></svg>
    </button>
    <button id="btn-save" class="btn btn-icon" title="Speichern (Strg+S)" data-i18n-title aria-label="Speichern" data-i18n-aria-label>
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 2.5h9l2 2v9h-11z"/><path d="M5 2.5v3.5h5V2.5M5 13.5V9.5h6v4"/></svg>
    </button>
    <select id="examples" aria-label="Beispiel laden" data-i18n-aria-label></select>
  </div>

  <div class="spacer"></div>

  <button id="btn-fit" class="btn btn-icon" title="Alles einpassen" data-i18n-title aria-label="Alles einpassen" data-i18n-aria-label>
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
  </button>
  <label class="topbar-field wide-only" title="Sprache der Oberfläche" data-i18n-title>
    <span data-i18n>Sprache</span>
    <select id="ui-lang" aria-label="Sprache" data-i18n-aria-label></select>
  </label>
  <button id="btn-theme" class="btn btn-icon wide-only" aria-label="Darstellung"></button>

  <!-- Erzeugen: nur ohne Fehler im Modell -->
  <div class="group wide-only" role="group" aria-label="Export" data-i18n-aria-label>
    <button id="btn-fw" data-export class="btn" title="CMake-Projekt mit build.sh / build.cmd" data-i18n-title data-i18n>Firmware</button>
    <button id="btn-prod" data-export class="btn" title="Produktdatenbank, unsigniert" data-i18n-title>knxprod</button>
    <button id="btn-all" data-export class="btn btn-primary" title="Firmware-Ordner und knxprod in einem ZIP" data-i18n-title data-i18n>Alles exportieren</button>
  </div>

  <!-- Schmale Fenster: Datei, Export, Sprache, Darstellung im Menü -->
  <button id="btn-more" class="btn btn-icon only-narrow" title="Menü" data-i18n-title aria-label="Menü" data-i18n-aria-label aria-haspopup="menu">
    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><circle cx="8" cy="3.5" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="12.5" r="1.4"/></svg>
  </button>
  <button id="btn-side" class="btn btn-icon only-narrow" title="Eigenschaften und Prüfung" data-i18n-title aria-label="Eigenschaften und Prüfung" data-i18n-aria-label>
    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M10 2v12M11.8 5h0M11.8 8h0"/></svg>
    <span id="side-badge" class="dot" hidden></span>
  </button>
</header>

<main id="main">
  <aside class="pane palette" id="palette" aria-label="Blöcke" data-i18n-aria-label></aside>
  <div class="resizer" data-edge="left" role="separator" aria-orientation="vertical" tabindex="0"
       title="Breite ändern (Doppelklick: zurücksetzen)" data-i18n-title></div>

  <section class="center">
    <div class="canvas-wrap">
      <svg id="canvas" aria-label="Logik des Geräts" data-i18n-aria-label></svg>
      <div class="canvas-hint" data-i18n>Blöcke aus der Liste ziehen oder anklicken · Ausgang → Eingang ziehen verbindet · Rechtsklick öffnet das Menü · Mausrad zoomt</div>
    </div>
    <div class="resizer horizontal" data-edge="output" role="separator" aria-orientation="horizontal" tabindex="0"
         title="Höhe ändern (Doppelklick: zurücksetzen)" data-i18n-title></div>
    <div class="output">
      <div class="out-bar">
        <button id="out-toggle" class="ghost" title="Ausgabe ein-/ausklappen" data-i18n-title data-i18n>Ausgabe</button>
        <div id="out-tabs" class="tabs"></div>
      </div>
      <pre id="out-code" class="code"></pre>
    </div>
  </section>

  <div class="resizer" data-edge="right" role="separator" aria-orientation="vertical" tabindex="0"
       title="Breite ändern (Doppelklick: zurücksetzen)" data-i18n-title></div>
  <aside class="pane side" id="side">
    <div id="inspector" class="inspector"></div>
    <div class="resizer horizontal" data-edge="msgs" role="separator" aria-orientation="horizontal" tabindex="0"
         title="Höhe ändern (Doppelklick: zurücksetzen)" data-i18n-title></div>
    <div class="msgs">
      <h3><span data-i18n>Prüfung</span> <span id="msg-count" class="badge"></span></h3>
      <ul id="messages"></ul>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
</main>

<div id="ctx" class="ctx" role="menu" hidden></div>
<input type="file" id="file-open" accept=".json,.sbs.json" hidden>
<input type="file" id="file-master" accept=".xml,.knxprod,.zip" hidden>
<div id="toast" class="toast" role="status"></div>

<script src="js/blocks.js"></script>
<script src="js/model.js"></script>
<script src="js/runtime-lpc11xx.js"></script>
<script src="js/gen-firmware.js"></script>
<script src="js/gen-knxprod.js"></script>
<script src="js/zip.js"></script>
<script src="js/examples.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
